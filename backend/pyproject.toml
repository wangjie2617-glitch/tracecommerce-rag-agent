[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecommerce-rag-agent"
version = "0.1.0"
description = "面向跨境电商客服与运营的可追溯 RAG Agent 系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
    "aiosqlite==0.21.0",
    "alembic==1.16.2",
    "PyJWT==2.10.1",
    "bcrypt==4.3.0",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.4",
    "lxml==5.4.0",
    "pypdf==5.7.0",
    "python-docx==1.2.0",
    "langchain==0.3.26",
    "langchain-openai==0.3.27",
    "langgraph==0.5.4",
    "pymilvus[model]==2.5.12",
    "sentence-transformers==5.0.0",
    "tenacity==9.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "milvus: requires a running Milvus service",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
